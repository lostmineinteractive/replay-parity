# Dependabot keeps the lockfile, the pinned actions, and the demo base images
# current. Every ecosystem runs weekly and nothing is ignored. The commit
# prefixes follow the conventional commit types the repository uses.
version: 2
updates:
  # The npm ecosystem reads the pnpm workspace from the root, so one entry
  # covers every package. Minor and patch updates arrive as one pull request.
  # Each major update gets its own, so a breaking change is reviewed alone.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: build
      include: scope

  # The actions in .github/workflows are pinned by commit SHA. Dependabot
  # moves the SHA and keeps the version comment next to it current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope

  # The two demo Dockerfiles share a base image. One entry watches both.
  - package-ecosystem: docker
    directories:
      - /
      - /demo/reference-service
      - /demo/candidate-service
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
