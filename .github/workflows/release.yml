name: release

# Runs when a version tag is pushed and on demand. docs/release.md describes
# the release procedure, the secret this workflow needs, and how a consumer
# verifies what it publishes.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# The default token can read the repository and nothing else. A job that
# publishes something asks for exactly what it needs in its own block.
permissions:
  contents: read

# One release at a time per ref. A running release is never cancelled, so a
# package is never left half published.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: lint, build, unit tests, guards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.meta.outputs.version }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm at the version in packageManager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install Node and restore the pnpm store
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Read the version and name the image
        id: meta
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match the package version $version" >&2
            exit 1
          fi
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$owner/replay-parity" >> "$GITHUB_OUTPUT"
      - name: Lint and format check
        run: pnpm lint
      - name: Typecheck and build
        run: pnpm build
      - name: Unit tests
        run: pnpm test:unit
      - name: Prose guard
        run: pnpm check-prose
      - name: Secrets guard
        run: pnpm check-secrets
      - name: Parallel services guard
        run: pnpm check-parallel

  publish-npm:
    name: publish to npm with provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    permissions:
      contents: read
      # npm signs a provenance statement with the OIDC token and stores it
      # next to each package. npm audit signatures verifies it.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm at the version in packageManager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install Node, restore the pnpm store, and point npm at the registry
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Publish every public package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        # pnpm replaces every workspace:* range with the published version and
        # skips a package whose version is already on the registry, so a rerun
        # publishes only what is missing.
        run: pnpm publish -r --access public --no-git-checks

  sbom:
    name: SBOM of the repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: CycloneDX SBOM from the lockfile
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: replay-parity-${{ needs.verify.outputs.version }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Upload the SBOM for the release job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-repository
          path: replay-parity-${{ needs.verify.outputs.version }}.cdx.json
          if-no-files-found: error

  image:
    name: build, push, sign, and attest the image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    permissions:
      contents: read
      # Push the image and the attestation to GHCR.
      packages: write
      # The keyless signature and the attestation are both minted with the
      # OIDC token, and the attestation is recorded on the repository.
      id-token: write
      attestations: write
    env:
      IMAGE: ${{ needs.verify.outputs.image }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The cosign signature and the SBOM attestation below are the image's
          # attestations. buildx adds none of its own, so the pushed digest is
          # the image manifest and not an index wrapping it.
          provenance: false
          sbom: false
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image by digest, keyless
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: CycloneDX SBOM of the image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: cyclonedx-json
          output-file: replay-parity-image-${{ env.VERSION }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest the SBOM and push the attestation to GHCR
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: replay-parity-image-${{ env.VERSION }}.cdx.json
          push-to-registry: true
      - name: Upload the image SBOM for the release job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-image
          path: replay-parity-image-${{ env.VERSION }}.cdx.json
          if-no-files-found: error

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [verify, publish-npm, image, sbom]
    permissions:
      # Create the release, create the tag when a dispatch runs without one,
      # and upload the assets.
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm at the version in packageManager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install Node and restore the pnpm store
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Pack every public package
        # pnpm resolves a relative destination against each package, so the
        # path is absolute.
        run: pnpm -r --filter './packages/*' pack --pack-destination "$PWD/release-assets"
      - name: Download the two SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom-*
          path: release-assets
          merge-multiple: true
      - name: Release notes from the changelog section for this version
        run: |
          awk -v v="$VERSION" '/^## / { on = ($2 == v); next } on' packages/cli/CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No changelog section for $VERSION in packages/cli/CHANGELOG.md." > release-notes.md
          fi
          cat release-notes.md
      - name: Create or update the release and upload the assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$tag" --notes-file release-notes.md
          else
            gh release create "$tag" --title "$tag" --notes-file release-notes.md --target "$GITHUB_SHA"
          fi
          ls -l release-assets
          gh release upload "$tag" release-assets/* --clobber
