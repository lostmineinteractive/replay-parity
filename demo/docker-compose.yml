# The demo pair. The reference is the system of record. The candidate runs
# the planted divergences selected by DIVERGENCES (default: the original
# four). Two more candidates serve the clean pair and the seeded defect so
# make demo can run its three replays without restarting anything.
services:
  reference:
    build:
      context: ..
      dockerfile: demo/reference-service/Dockerfile
    ports:
      - '${DEMO_REFERENCE_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
  candidate:
    build:
      context: ..
      dockerfile: demo/candidate-service/Dockerfile
    environment:
      DIVERGENCES: '${DIVERGENCES:-on}'
      DIVERGENCE_SEED: '1'
    ports:
      - '${DEMO_CANDIDATE_PORT:-3001}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
  candidate-clean:
    build:
      context: ..
      dockerfile: demo/candidate-service/Dockerfile
    environment:
      DIVERGENCES: 'off'
    ports:
      - '${DEMO_CLEAN_PORT:-3002}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
  candidate-defect:
    build:
      context: ..
      dockerfile: demo/candidate-service/Dockerfile
    environment:
      DIVERGENCES: '${DEMO_DEFECT:-shipment-applied-twice}'
    ports:
      - '${DEMO_DEFECT_PORT:-3003}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
